name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
          - name: macOS / Clang (arm64)
            os: macos-latest
          - name: Windows / MSVC
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Clang / ThreadSanitizer
            flags: -fsanitize=thread -fno-omit-frame-pointer -g
          - name: Linux / Clang / Address+UndefinedSanitizer
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g

    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1:history_size=7:second_deadlock_stack=1
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v5

      - name: Lower ASLR entropy for sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900

      - name: Integrated multi-threaded run
        run: ./build/high_frequency --trials 3

      - name: Order book microbenchmark
        run: ./build/bench_lob --repeat 1

      - name: Routing decision microbenchmark
        run: ./build/bench_sor --repeat 1
